# Everything the Scout site needs from nginx, shared by every domain that
# serves it. Each domain's `listen 443` server block in
# /etc/nginx/sites-available/ needs only its server_name, its certificate and
#   include /var/www/inlovingmemoryofscout.com/html/server/nginx-site.conf;
# After editing this file: nginx -t && systemctl reload nginx

root /var/www/inlovingmemoryofscout.com/html;
index index.html index.htm;

# Pages, styles, scripts and the media lists: browsers must check for a newer
# copy each visit (a cheap 304 when unchanged), so edits show up right away.
# ($scout_cache is the map in /etc/nginx/conf.d/scout-cache.conf.)
add_header Cache-Control $scout_cache;

# script.js reads this listing to build the slideshow and gallery.
location /media/ {
	autoindex on;
}

# Messages for Scout backend (server/messages.js on 127.0.0.1:3311), and
# their photos and videos: /api/messages/file/<id>/<n>,
# /messages-admin/file/<id>/<n>.
# Host is passed on so the backends can tell which domain the page came from.
location ^~ /api/messages {
	proxy_pass http://127.0.0.1:3311;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	client_max_body_size 64k;
}
# Each photo or video is uploaded on its own first (300 MB max for a video,
# checked by the backend), streamed straight through.
location = /api/messages/upload {
	proxy_pass http://127.0.0.1:3311;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	client_max_body_size 310m;
	proxy_request_buffering off;
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;
}
location ^~ /messages-admin {
	proxy_pass http://127.0.0.1:3311;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
}

# The admin sign-in (/admin/login, /admin/logout) and /admin, the page of
# links to everything, are served by the media manager too.
location = /admin {
	proxy_pass http://127.0.0.1:3312;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
}
location ^~ /admin/ {
	proxy_pass http://127.0.0.1:3312;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
}

# Scout media manager (server/media.js on 127.0.0.1:3312).
location ^~ /media-admin {
	proxy_pass http://127.0.0.1:3312;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	client_max_body_size 1g;
	proxy_request_buffering off;
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;
}

# Keep the repo's private bits off the web: .git and other dotfiles,
# the server code, and the notes files.
location ~ /\.(?!well-known/) { deny all; }
location ^~ /server/ { deny all; }
location ~ ^/(CLAUDE\.md|claude_resumetxt|github\.md)$ { deny all; }
