# Add these inside the `listen 443` server block of
# /etc/nginx/sites-available/inlovingmemoryofscout.com, then:
#   nginx -t && systemctl reload nginx

	# Messages for Scout backend (server/messages.js on 127.0.0.1:3311).
	location = /api/messages {
		proxy_pass http://127.0.0.1:3311;
		proxy_set_header X-Real-IP $remote_addr;
		client_max_body_size 16k;
	}
	location = /messages-admin {
		proxy_pass http://127.0.0.1:3311;
		proxy_set_header X-Real-IP $remote_addr;
	}

	# Keep the repo's private bits off the web: .git and other dotfiles,
	# the server code, and the notes files.
	location ~ /\.(?!well-known/) { deny all; }
	location ^~ /server/ { deny all; }
	location ~ ^/(CLAUDE\.md|claude_resumetxt|github\.md)$ { deny all; }
